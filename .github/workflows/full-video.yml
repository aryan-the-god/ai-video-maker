name: Make Full Video

# ONE button: topic -> script -> voice -> pictures -> finished video.
# If the free picture limit runs out, it waits for the next day by itself and continues.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Title/topic (raja aur mantri ki sajish) OR paste your full script here"
        required: true
        type: string
      minutes:
        description: "Video length in minutes"
        required: true
        default: "15"
        type: choice
        options: ["5", "10", "15", "20", "30"]
      language:
        description: "Voice-over language"
        required: true
        default: "Hindi"
        type: choice
        options: ["Hindi", "English"]
      voice:
        description: "Voice"
        required: true
        default: "Alternate every chapter"
        type: choice
        options: ["Male", "Female", "Alternate every chapter", "Alternate every scene"]
      style:
        description: "Picture style"
        required: true
        default: "storybook"
        type: choice
        options: ["storybook", "inkwash", "painterly", "cartoon"]
      color:
        description: "Colour"
        required: true
        default: "colored"
        type: choice
        options: ["colored", "vintage"]
      music:
        description: "Background music"
        required: true
        default: "calm"
        type: choice
        options: ["calm", "dramatic", "none"]
      music_volume:
        description: "Music volume in percent (35 = normal)"
        required: true
        default: "35"
        type: choice
        options: ["10", "15", "20", "25", "35", "50", "70", "100"]

jobs:
  script:
    name: Write the script
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TOPIC: ${{ inputs.topic }}

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install -r requirements.txt

      - name: Write the script with AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MINUTES: ${{ inputs.minutes }}
          LANGUAGE: ${{ inputs.language }}
          STYLE: ${{ inputs.style }}
          COLOR: ${{ inputs.color }}
        run: python write_script.py

      - name: Save the script
        uses: actions/upload-artifact@v7
        with:
          name: script
          path: output/

      - name: Tell me on Telegram
        run: python notify.py --script-summary output/script.json

      - name: Tell me if something failed
        if: failure()
        run: |
          python notify.py "❌ Something failed for: ${TOPIC:0:60} — open this link and send the red error to Claude: $RUN_URL"

  approve:
    name: Wait for your OK on the script
    needs: script
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Wait for your reply on Telegram
        run: python telegram_review.py approve

  voice:
    name: Make the voice-over
    needs: [script, approve]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TOPIC: ${{ inputs.topic }}
      LANGUAGE: ${{ inputs.language }}
      VOICE_CHOICE: ${{ inputs.voice }}
      ENGINE_CHOICE: Kokoro (open-source)
      PACE: storyteller

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Get the script
        uses: actions/download-artifact@v7
        with:
          name: script
          path: output/

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install voice tools
        run: |
          pip install edge-tts soundfile numpy requests
          for i in 1 2 3; do
            if timeout 240 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq \
               && timeout 400 sudo apt-get -o Acquire::Retries=3 install -y -qq espeak-ng ffmpeg; then
              break
            fi
            echo "apt failed (try $i), waiting 15 s"; sleep 15
          done
          if [ "$ENGINE_CHOICE" != "Natural (Microsoft Edge voices)" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
            pip install "kokoro>=0.9.4"
          fi

      - name: Make the voice-over
        run: |
          case "$VOICE_CHOICE" in
            "Male") export VOICE_MODE=male ;;
            "Female") export VOICE_MODE=female ;;
            "Alternate every scene") export VOICE_MODE=alternate_scene ;;
            *) export VOICE_MODE=alternate_chapter ;;
          esac
          if [ "$ENGINE_CHOICE" = "Natural (Microsoft Edge voices)" ]; then export ENGINE=edge; else export ENGINE=kokoro; fi
          python voice.py

      - name: Save the voice-over
        uses: actions/upload-artifact@v7
        with:
          name: voice
          path: output/

      - name: Tell me if something failed
        if: failure()
        run: |
          python notify.py "❌ Voice-over failed for: ${TOPIC:0:60} — open this link and send the red error to Claude: $RUN_URL"

  images_a:
    name: Make the pictures (day 1)
    needs: voice
    if: ${{ !cancelled() && needs.voice.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    outputs:
      done: ${{ steps.check.outputs.done }}
      resume_at: ${{ steps.check.outputs.resume_at }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Get the script
        uses: actions/download-artifact@v7
        with:
          name: voice
          path: output/

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install requests

      - name: Make the pictures
        continue-on-error: true
        run: python make_images.py 1 999

      - name: Check how many pictures are done
        id: check
        run: |
          python - <<'PY'
          import json, os, time, pathlib
          n = len(json.load(open("output/script.json", encoding="utf-8"))["scenes"])
          have = len([p for p in pathlib.Path("images").glob("scene_*.jpg") if p.stat().st_size > 5000])
          now = time.time()
          resume = (int(now // 86400) + 1) * 86400 + 300   # next 00:05 UTC
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"done={'true' if have >= n else 'false'}\n")
              f.write(f"resume_at={resume}\n")
          print(have, "of", n, "pictures")
          PY

      - name: Save the pictures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: images-a
          path: images/

      - name: Tell me if it failed
        if: failure()
        run: |
          python notify.py "❌ Pictures failed — open this link and send the red error to Claude: $RUN_URL"

  wait1:
    name: Wait for free limit reset (1/5)
    needs: images_a
    if: ${{ !cancelled() && needs.images_a.result == 'success' && needs.images_a.outputs.done != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Sleep until the daily limit resets
        env:
          RESUME_AT: ${{ needs.images_a.outputs.resume_at }}
        run: |
          now=$(date +%s); left=$((RESUME_AT - now))
          if [ $left -le 0 ]; then echo "already reset"; exit 0; fi
          if [ $left -gt 20400 ]; then left=20400; fi
          echo "sleeping $left s"; sleep $left

  wait2:
    name: Wait for free limit reset (2/5)
    needs: wait1
    if: ${{ !cancelled() && needs.images_a.result == 'success' && needs.images_a.outputs.done != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Sleep until the daily limit resets
        env:
          RESUME_AT: ${{ needs.images_a.outputs.resume_at }}
        run: |
          now=$(date +%s); left=$((RESUME_AT - now))
          if [ $left -le 0 ]; then echo "already reset"; exit 0; fi
          if [ $left -gt 20400 ]; then left=20400; fi
          echo "sleeping $left s"; sleep $left

  wait3:
    name: Wait for free limit reset (3/5)
    needs: wait2
    if: ${{ !cancelled() && needs.images_a.result == 'success' && needs.images_a.outputs.done != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Sleep until the daily limit resets
        env:
          RESUME_AT: ${{ needs.images_a.outputs.resume_at }}
        run: |
          now=$(date +%s); left=$((RESUME_AT - now))
          if [ $left -le 0 ]; then echo "already reset"; exit 0; fi
          if [ $left -gt 20400 ]; then left=20400; fi
          echo "sleeping $left s"; sleep $left

  wait4:
    name: Wait for free limit reset (4/5)
    needs: wait3
    if: ${{ !cancelled() && needs.images_a.result == 'success' && needs.images_a.outputs.done != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Sleep until the daily limit resets
        env:
          RESUME_AT: ${{ needs.images_a.outputs.resume_at }}
        run: |
          now=$(date +%s); left=$((RESUME_AT - now))
          if [ $left -le 0 ]; then echo "already reset"; exit 0; fi
          if [ $left -gt 20400 ]; then left=20400; fi
          echo "sleeping $left s"; sleep $left

  wait5:
    name: Wait for free limit reset (5/5)
    needs: wait4
    if: ${{ !cancelled() && needs.images_a.result == 'success' && needs.images_a.outputs.done != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Sleep until the daily limit resets
        env:
          RESUME_AT: ${{ needs.images_a.outputs.resume_at }}
        run: |
          now=$(date +%s); left=$((RESUME_AT - now))
          if [ $left -le 0 ]; then echo "already reset"; exit 0; fi
          if [ $left -gt 20400 ]; then left=20400; fi
          echo "sleeping $left s"; sleep $left

  images_b:
    name: Make the pictures (day 2)
    needs: [images_a, wait5]
    if: ${{ !cancelled() && needs.images_a.result == 'success' && needs.images_a.outputs.done != 'true' && needs.wait5.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    outputs:
      done: ${{ steps.check.outputs.done }}
      resume_at: ${{ steps.check.outputs.resume_at }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Get the script
        uses: actions/download-artifact@v7
        with:
          name: voice
          path: output/

      - name: Get the pictures made so far
        uses: actions/download-artifact@v7
        with:
          name: images-a
          path: images/

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install requests

      - name: Make the remaining pictures
        continue-on-error: true
        run: python make_images.py 1 999

      - name: Check how many pictures are done
        id: check
        run: |
          python - <<'PY'
          import json, os, pathlib, time
          n = len(json.load(open("output/script.json", encoding="utf-8"))["scenes"])
          have = len([p for p in pathlib.Path("images").glob("scene_*.jpg") if p.stat().st_size > 5000])
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"done={'true' if have >= n else 'false'}\n")
              f.write(f"resume_at={(int(time.time() // 86400) + 1) * 86400 + 300}\n")
          print(have, "of", n, "pictures")
          PY

      - name: Save the pictures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: images-b
          path: images/


  wait6:
    name: Wait for free limit reset (1/5, day 3)
    needs: images_b
    if: ${{ !cancelled() && needs.images_b.result == 'success' && needs.images_b.outputs.done != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Sleep until the daily limit resets
        env:
          RESUME_AT: ${{ needs.images_b.outputs.resume_at }}
        run: |
          now=$(date +%s); left=$((RESUME_AT - now))
          if [ $left -le 0 ]; then echo "already reset"; exit 0; fi
          if [ $left -gt 20400 ]; then left=20400; fi
          echo "sleeping $left s"; sleep $left

  wait7:
    name: Wait for free limit reset (2/5, day 3)
    needs: [wait6, images_b]
    if: ${{ !cancelled() && needs.images_b.result == 'success' && needs.images_b.outputs.done != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Sleep until the daily limit resets
        env:
          RESUME_AT: ${{ needs.images_b.outputs.resume_at }}
        run: |
          now=$(date +%s); left=$((RESUME_AT - now))
          if [ $left -le 0 ]; then echo "already reset"; exit 0; fi
          if [ $left -gt 20400 ]; then left=20400; fi
          echo "sleeping $left s"; sleep $left

  wait8:
    name: Wait for free limit reset (3/5, day 3)
    needs: [wait7, images_b]
    if: ${{ !cancelled() && needs.images_b.result == 'success' && needs.images_b.outputs.done != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Sleep until the daily limit resets
        env:
          RESUME_AT: ${{ needs.images_b.outputs.resume_at }}
        run: |
          now=$(date +%s); left=$((RESUME_AT - now))
          if [ $left -le 0 ]; then echo "already reset"; exit 0; fi
          if [ $left -gt 20400 ]; then left=20400; fi
          echo "sleeping $left s"; sleep $left

  wait9:
    name: Wait for free limit reset (4/5, day 3)
    needs: [wait8, images_b]
    if: ${{ !cancelled() && needs.images_b.result == 'success' && needs.images_b.outputs.done != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Sleep until the daily limit resets
        env:
          RESUME_AT: ${{ needs.images_b.outputs.resume_at }}
        run: |
          now=$(date +%s); left=$((RESUME_AT - now))
          if [ $left -le 0 ]; then echo "already reset"; exit 0; fi
          if [ $left -gt 20400 ]; then left=20400; fi
          echo "sleeping $left s"; sleep $left

  wait10:
    name: Wait for free limit reset (5/5, day 3)
    needs: [wait9, images_b]
    if: ${{ !cancelled() && needs.images_b.result == 'success' && needs.images_b.outputs.done != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Sleep until the daily limit resets
        env:
          RESUME_AT: ${{ needs.images_b.outputs.resume_at }}
        run: |
          now=$(date +%s); left=$((RESUME_AT - now))
          if [ $left -le 0 ]; then echo "already reset"; exit 0; fi
          if [ $left -gt 20400 ]; then left=20400; fi
          echo "sleeping $left s"; sleep $left

  images_c:
    name: Make the pictures (day 3)
    needs: [images_b, wait10]
    if: ${{ !cancelled() && needs.images_b.result == 'success' && needs.images_b.outputs.done != 'true' && needs.wait10.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    outputs:
      done: ${{ steps.check.outputs.done }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Get the script
        uses: actions/download-artifact@v7
        with:
          name: voice
          path: output/

      - name: Get the pictures made so far
        uses: actions/download-artifact@v7
        with:
          name: images-b
          path: images/

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install requests

      - name: Make the remaining pictures
        continue-on-error: true
        run: python make_images.py 1 999

      - name: Check how many pictures are done
        id: check
        run: |
          python - <<'PY'
          import json, os, pathlib, time
          n = len(json.load(open("output/script.json", encoding="utf-8"))["scenes"])
          have = len([p for p in pathlib.Path("images").glob("scene_*.jpg") if p.stat().st_size > 5000])
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"done={'true' if have >= n else 'false'}\n")
              f.write(f"resume_at={(int(time.time() // 86400) + 1) * 86400 + 300}\n")
          print(have, "of", n, "pictures")
          PY

      - name: Save the pictures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: images-c
          path: images/


      - name: Stop if pictures are still missing
        if: steps.check.outputs.done != 'true'
        run: |
          python notify.py "⚠️ Kuch pictures abhi bhi baaki hain (free limit). Make Images workflow se baaki scenes alag chalao. $RUN_URL"
          exit 1

  assemble:
    name: Join pictures, voice, music and subtitles
    needs: [images_a, images_b, images_c]
    if: ${{ !cancelled() && needs.images_a.result == 'success' && (needs.images_a.outputs.done == 'true' || needs.images_b.outputs.done == 'true' || needs.images_c.outputs.done == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Get script and voice-over
        uses: actions/download-artifact@v7
        with:
          name: voice
          path: output/

      - name: Get the pictures
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.images_a.outputs.done == 'true' && 'images-a' || (needs.images_b.outputs.done == 'true' && 'images-b' || 'images-c') }}
          path: images/

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tools
        timeout-minutes: 20
        run: |
          pip install requests opencv-python-headless numpy
          for i in 1 2 3; do
            if timeout 240 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq \
               && timeout 400 sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg fonts-noto-core; then
              break
            fi
            echo "apt failed (try $i), waiting 15 s"; sleep 15
          done

      - name: Join everything
        env:
          MUSIC_CHOICE: ${{ inputs.music }}
          MUSIC_VOLUME: ${{ inputs.music_volume }}
        run: python assemble_images.py 1 999 yes $MUSIC_CHOICE $MUSIC_VOLUME

      - name: Save the video
        uses: actions/upload-artifact@v7
        with:
          name: video
          path: final/

      - name: Tell me on Telegram
        run: python assemble_report.py

      - name: Tell me if something failed
        if: failure()
        run: |
          python notify.py "❌ Video joining failed — open this link and send the red error to Claude: $RUN_URL"

  review:
    name: Review pictures with you on Telegram
    needs: [assemble, images_a, images_b, images_c]
    if: ${{ !cancelled() && needs.assemble.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      MUSIC: ${{ inputs.music }}
      MUSIC_VOLUME: ${{ inputs.music_volume }}
    steps:
      - uses: actions/checkout@v7

      - name: Get script and voice-over
        uses: actions/download-artifact@v7
        with:
          name: voice
          path: output/

      - name: Get the pictures
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.images_a.outputs.done == 'true' && 'images-a' || (needs.images_b.outputs.done == 'true' && 'images-b' || 'images-c') }}
          path: images/

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tools
        timeout-minutes: 20
        run: |
          pip install requests pillow opencv-python-headless numpy
          for i in 1 2 3; do
            if timeout 240 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq \
               && timeout 400 sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg fonts-noto-core fonts-dejavu-core; then
              break
            fi
            echo "apt failed (try $i), waiting 15 s"; sleep 15
          done

      - name: Wait for your picture feedback
        run: python telegram_review.py pictures

      - name: Save the final video
        uses: actions/upload-artifact@v7
        with:
          name: video-final
          path: final/
          if-no-files-found: ignore

      - name: Tell me if something failed
        if: failure()
        run: |
          python notify.py "❌ Review step failed — open this link and send the red error to Claude: $RUN_URL"
