name: Assemble Video (Pictures)

on:
  workflow_dispatch:
    inputs:
      voice_run_id:
        description: "Make Video run number (the script + voice-over run)"
        required: true
        type: string
      images_run_id:
        description: "Make Images run number (pictures, part 1)"
        required: true
        type: string
      images_run_id_2:
        description: "Optional: Make Images run number for part 2 (if you made pictures on another day)"
        required: false
        default: ""
        type: string
      images_run_id_3:
        description: "Optional: Make Images run number for part 3"
        required: false
        default: ""
        type: string
      first_scene:
        description: "First scene number"
        required: true
        default: "1"
        type: string
      last_scene:
        description: "Last scene number"
        required: true
        default: "200"
        type: string
      fix_run_id:
        description: "Optional: Make Images run number of a 'redo' run (fixed pictures replace the bad ones)"
        required: false
        default: ""
        type: string
      subtitles:
        description: "Burn subtitles into the video?"
        required: true
        default: "yes"
        type: choice
        options: ["yes", "no"]
      music:
        description: "Background music"
        required: true
        default: "calm"
        type: choice
        options: ["calm", "dramatic", "my own file (music/bg.mp3)", "none"]
      sfx:
        description: "Sound effects (wind, fire, crowd, night, rain...)"
        required: true
        default: "light"
        type: choice
        options: ["light", "medium", "none"]

jobs:
  assemble:
    name: Join pictures, voice and subtitles
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Get script and voice-over
        uses: actions/download-artifact@v7
        with:
          name: voice
          path: output/
          run-id: ${{ inputs.voice_run_id }}
          github-token: ${{ github.token }}

      - name: Get the pictures (part 1)
        id: pics1
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: images
          path: images/
          run-id: ${{ inputs.images_run_id }}
          github-token: ${{ github.token }}

      - name: Get the pictures (part 1, older run name)
        if: steps.pics1.outcome == 'failure'
        uses: actions/download-artifact@v7
        with:
          name: images-${{ inputs.first_scene }}-24
          path: images/
          run-id: ${{ inputs.images_run_id }}
          github-token: ${{ github.token }}

      - name: Get the pictures (part 2)
        if: inputs.images_run_id_2 != ''
        uses: actions/download-artifact@v7
        with:
          name: images
          path: images/
          run-id: ${{ inputs.images_run_id_2 }}
          github-token: ${{ github.token }}

      - name: Get the pictures (part 3)
        if: inputs.images_run_id_3 != ''
        uses: actions/download-artifact@v7
        with:
          name: images
          path: images/
          run-id: ${{ inputs.images_run_id_3 }}
          github-token: ${{ github.token }}

      - name: Get the fixed pictures (if any)
        if: inputs.fix_run_id != ''
        uses: actions/download-artifact@v7
        with:
          name: images-fix
          path: images/
          run-id: ${{ inputs.fix_run_id }}
          github-token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tools
        timeout-minutes: 20
        run: |
          pip install requests opencv-python-headless numpy
          for i in 1 2 3; do
            if timeout 240 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq \
               && timeout 400 sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg fonts-noto-core; then
              break
            fi
            echo "apt failed (try $i), waiting 15 s"
            sleep 15
          done
          ffmpeg -version | head -1
          fc-list | grep -ci "noto sans devanagari" || true
          ls images | head -5

      - name: Join everything
        env:
          MUSIC_CHOICE: ${{ inputs.music }}
          SFX_CHOICE: ${{ inputs.sfx }}
        run: |
          case "$MUSIC_CHOICE" in
            calm) M=calm ;;
            dramatic) M=dramatic ;;
            none) M=none ;;
            *) M=file ;;
          esac
          python assemble_images.py ${{ inputs.first_scene }} ${{ inputs.last_scene }} ${{ inputs.subtitles }} $M $SFX_CHOICE

      - name: Save the video
        uses: actions/upload-artifact@v7
        with:
          name: video
          path: final/

      - name: Tell me on Telegram
        run: python assemble_report.py

      - name: Tell me if something failed
        if: failure()
        run: |
          python notify.py "❌ Video joining failed — open this link and send the red error to Claude: $RUN_URL"
