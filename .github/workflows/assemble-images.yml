name: Assemble Video (Pictures)

on:
  workflow_dispatch:
    inputs:
      voice_run_id:
        description: "Make Video run number (the script + voice-over run)"
        required: true
        type: string
      images_run_id:
        description: "Make Images run number"
        required: true
        type: string
      first_scene:
        description: "First scene number"
        required: true
        default: "1"
        type: string
      last_scene:
        description: "Last scene number"
        required: true
        default: "24"
        type: string
      subtitles:
        description: "Burn subtitles into the video?"
        required: true
        default: "yes"
        type: choice
        options: ["yes", "no"]

jobs:
  assemble:
    name: Join pictures, voice and subtitles
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Get script and voice-over
        uses: actions/download-artifact@v7
        with:
          name: voice
          path: output/
          run-id: ${{ inputs.voice_run_id }}
          github-token: ${{ github.token }}

      - name: Get the pictures
        uses: actions/download-artifact@v7
        with:
          name: images-${{ inputs.first_scene }}-${{ inputs.last_scene }}
          path: images/
          run-id: ${{ inputs.images_run_id }}
          github-token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          pip install requests
          ls images | head -5

      - name: Join everything
        run: python assemble_images.py ${{ inputs.first_scene }} ${{ inputs.last_scene }} ${{ inputs.subtitles }}

      - name: Save the video
        uses: actions/upload-artifact@v7
        with:
          name: video
          path: final/

      - name: Tell me on Telegram
        run: python assemble_report.py

      - name: Tell me if something failed
        if: failure()
        run: |
          python notify.py "❌ Video joining failed — open this link and send the red error to Claude: $RUN_URL"
