name: Voice Test

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Hindi text to read (leave empty for the default sample)"
        required: false
        type: string

jobs:
  voices:
    name: Make voice samples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SAMPLE_TEXT: ${{ inputs.text }}

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install voice tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "kokoro>=0.9.4" soundfile edge-tts requests

      - name: Make samples and send them to Telegram
        run: python voice_test.py

      - name: Tell me if something failed
        if: failure()
        run: |
          python notify.py "❌ Voice test failed — open this link and send the red error to Claude: $RUN_URL"
