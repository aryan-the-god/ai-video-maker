name: Make Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Title/topic (raja aur mantri ki sajish) OR paste your full script here"
        required: true
        type: string
      minutes:
        description: "Video length in minutes"
        required: true
        default: "15"
        type: choice
        options: ["5", "10", "15", "20"]
      language:
        description: "Voice-over language"
        required: true
        default: "English"
        type: choice
        options: ["English", "Hindi"]
      style:
        description: "Picture style"
        required: true
        default: "storybook"
        type: choice
        options:
          - "storybook"
          - "inkwash"
          - "painterly"
          - "cartoon"
      color:
        description: "Colour"
        required: true
        default: "colored"
        type: choice
        options:
          - "colored"
          - "vintage"
      voice:
        description: "Voice-over style"
        required: true
        default: "Badal badal ke - har chapter"
        type: choice
        options:
          - "Male (Psi)"
          - "Female (Alpha)"
          - "Badal badal ke - har chapter"
          - "Badal badal ke - har scene"

      engine:
        description: "Voice engine"
        required: true
        default: "Natural (Microsoft Edge voices)"
        type: choice
        options:
          - "Natural (Microsoft Edge voices)"
          - "Kokoro (open-source)"
      pace:
        description: "Speaking speed"
        required: true
        default: "storyteller"
        type: choice
        options:
          - "storyteller"
          - "slow"
          - "normal"

jobs:
  script:
    name: Write the script
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TOPIC: ${{ inputs.topic }}

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install -r requirements.txt

      - name: Write the script with AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MINUTES: ${{ inputs.minutes }}
          LANGUAGE: ${{ inputs.language }}
          STYLE: ${{ inputs.style }}
          COLOR: ${{ inputs.color }}
        run: python write_script.py

      - name: Save the script
        uses: actions/upload-artifact@v7
        with:
          name: script
          path: output/

      - name: Tell me on Telegram
        run: python notify.py --script-summary output/script.json

      - name: Tell me if something failed
        if: failure()
        run: |
          python notify.py "❌ Something failed for: ${TOPIC:0:60} — open this link and send the red error to Claude: $RUN_URL"

  voice:
    name: Make the voice-over
    needs: script
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TOPIC: ${{ inputs.topic }}
      LANGUAGE: ${{ inputs.language }}
      VOICE_CHOICE: ${{ inputs.voice }}
      ENGINE_CHOICE: ${{ inputs.engine }}
      PACE: ${{ inputs.pace }}

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Get the script
        uses: actions/download-artifact@v7
        with:
          name: script
          path: output/

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install voice tools
        run: |
          pip install edge-tts soundfile numpy requests
          for i in 1 2 3; do
            if timeout 240 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq \
               && timeout 400 sudo apt-get -o Acquire::Retries=3 install -y -qq espeak-ng ffmpeg; then
              break
            fi
            echo "apt failed (try $i), waiting 15 s"; sleep 15
          done
          if [ "$ENGINE_CHOICE" != "Natural (Microsoft Edge voices)" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
            pip install "kokoro>=0.9.4"
          fi

      - name: Make the voice-over
        run: |
          case "$VOICE_CHOICE" in
            "Male (Psi)") export VOICE_MODE=male ;;
            "Female (Alpha)") export VOICE_MODE=female ;;
            "Badal badal ke - har scene") export VOICE_MODE=alternate_scene ;;
            *) export VOICE_MODE=alternate_chapter ;;
          esac
          if [ "$ENGINE_CHOICE" = "Natural (Microsoft Edge voices)" ]; then export ENGINE=edge; else export ENGINE=kokoro; fi
          python voice.py

      - name: Save the voice-over
        uses: actions/upload-artifact@v7
        with:
          name: voice
          path: output/

      - name: Tell me if something failed
        if: failure()
        run: |
          python notify.py "❌ Voice-over failed for: ${TOPIC:0:60} — open this link and send the red error to Claude: $RUN_URL"
