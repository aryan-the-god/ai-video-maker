name: Quality Test

on:
  workflow_dispatch:

jobs:
  test:
    name: Test video models on Kaggle
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      KAGGLE_USERNAME: aryanthegod
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install kaggle requests six

      - name: Start the test on Kaggle
        run: kaggle kernels push -p kaggle/quality_test

      - name: Wait for Kaggle to finish
        run: |
          for i in $(seq 1 150); do
            sleep 60
            s=$(kaggle kernels status aryanthegod/quality-test 2>&1 || true)
            echo "$i min: $s"
            if echo "$s" | grep -qiE "complete|error|cancel"; then break; fi
          done

      - name: Download results
        run: kaggle kernels output aryanthegod/quality-test -p kaggle_out

      - name: Tell me on Telegram
        run: python quality_report.py kaggle_out

      - name: Tell me if something failed
        if: failure()
        run: |
          python notify.py "❌ Quality test failed — open this link and send the red error to Claude: $RUN_URL"
