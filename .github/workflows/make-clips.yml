name: Make Clips

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run number from the Make Video link (the long number at the end of the URL)"
        required: true
        type: string
      first_scene:
        description: "First scene number"
        required: true
        default: "1"
        type: string
      last_scene:
        description: "Last scene number (keep parts small, about 40 scenes at most)"
        required: true
        default: "3"
        type: string

jobs:
  clips:
    name: Make clips on Kaggle
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      KAGGLE_USERNAME: aryanthegod
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Get the script and voice-over
        uses: actions/download-artifact@v7
        with:
          name: voice
          path: output/
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install kaggle requests six

      - name: Plan the clips
        run: python prep_clips.py ${{ inputs.first_scene }} ${{ inputs.last_scene }}

      - name: Start the clip job on Kaggle
        run: kaggle kernels push -p kaggle/gen_clips

      - name: Wait for Kaggle to finish
        run: |
          for i in $(seq 1 330); do
            sleep 60
            s=$(kaggle kernels status aryanthegod/ai-clips 2>&1 || true)
            echo "$i min: $s"
            if echo "$s" | grep -qiE "complete|error|cancel"; then break; fi
          done

      - name: Download the clips
        run: kaggle kernels output aryanthegod/ai-clips -p kaggle_out

      - name: Save the clips
        uses: actions/upload-artifact@v7
        with:
          name: clips-${{ inputs.first_scene }}-${{ inputs.last_scene }}
          path: kaggle_out/

      - name: Tell me on Telegram
        run: python clips_report.py kaggle_out

      - name: Tell me if something failed
        if: failure()
        run: |
          python notify.py "❌ Clip making failed — open this link and send the red error to Claude: $RUN_URL"
